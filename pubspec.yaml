name: jemari_bicara
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+2
  permission_handler: ^11.3.0
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/finger1.png
    - assets/logo.png
    - assets/logo_clean.png
    - assets/logo_splash.png
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_splash.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#E6F2FF"
  image: assets/logo_splash.png
  android_12:
    color: "#E6F2FF"
    image: assets/logo_splash.png



